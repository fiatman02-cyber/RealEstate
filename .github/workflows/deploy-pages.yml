########################################################################
#  เอาเว็บขึ้น GitHub Pages อัตโนมัติ
#  ทุกครั้งที่มีการ push ขึ้น branch main เว็บจะอัปเดตเองภายใน 1-2 นาที
#  ไม่ต้องทำอะไรเพิ่ม ไม่ต้องกดปุ่มใดๆ
########################################################################
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

# ถ้ามีการ push ซ้อนกัน ให้ deploy ตัวล่าสุดเท่านั้น
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ดึงโค้ดจาก repo
        uses: actions/checkout@v4

      - name: เปิดใช้ GitHub Pages (ถ้ายังไม่เปิด จะเปิดให้เอง)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: แพ็กไฟล์เว็บทั้งหมด
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: ปล่อยขึ้นเว็บ
        id: deployment
        uses: actions/deploy-pages@v4
